<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 15px Arial, sans-serif; fill: #374151; }
      .section { font: 700 20px Arial, sans-serif; fill: #0f3b8f; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .text { font: 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .note { font: italic 14px Arial, sans-serif; fill: #0f3b8f; }
      .layer { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 18; }
      .input { fill: #f8fbff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .process { fill: #fff8e8; stroke: #92400e; stroke-width: 2; rx: 14; }
      .python { fill: #eefaf1; stroke: #047857; stroke-width: 2; rx: 14; }
      .db { fill: #f7fbff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .score { fill: #fbf8ff; stroke: #7c3aed; stroke-width: 2; rx: 14; }
      .valid { fill: #f0fdf4; stroke: #047857; stroke-width: 2; rx: 14; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
      .arrow { stroke: #1f2937; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #1f2937; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1700" height="900" fill="#ffffff"/>
  <text x="850" y="45" text-anchor="middle" class="title">Correction des Noms Propres et Entity Linking</text>
  <text x="850" y="75" text-anchor="middle" class="subtitle">Transformation d'une transcription approximative en entites reliees aux donnees institutionnelles</text>

  <text x="60" y="150" class="section">1. Texte</text>
  <text x="60" y="175" class="section">transcrit</text>
  <rect x="230" y="115" width="1230" height="120" class="layer"/>

  <text x="60" y="335" class="section">2. Analyse</text>
  <text x="60" y="360" class="section">des candidats</text>
  <rect x="230" y="295" width="1230" height="155" class="layer"/>

  <text x="60" y="545" class="section">3. Liaison</text>
  <text x="60" y="570" class="section">a la base</text>
  <rect x="230" y="500" width="1230" height="165" class="layer"/>

  <text x="60" y="755" class="section">4. Sortie</text>
  <rect x="230" y="715" width="1230" height="120" class="layer"/>

  <!-- Row 1 -->
  <rect x="270" y="145" width="260" height="65" class="input"/>
  <text x="400" y="172" text-anchor="middle" class="box-title">Transcription brute</text>
  <text x="400" y="195" text-anchor="middle" class="small">ex: "cours de WM RF lundi"</text>

  <rect x="610" y="145" width="270" height="65" class="process"/>
  <text x="745" y="172" text-anchor="middle" class="box-title">Nettoyage</text>
  <text x="745" y="195" text-anchor="middle" class="small">minuscules, accents, repetitions</text>

  <rect x="960" y="145" width="270" height="65" class="python"/>
  <text x="1095" y="172" text-anchor="middle" class="box-title">Normalisation vocale</text>
  <text x="1095" y="195" text-anchor="middle" class="small">speech_entity_linker.py</text>

  <!-- Row 2 -->
  <rect x="270" y="330" width="260" height="80" class="process"/>
  <text x="400" y="360" text-anchor="middle" class="box-title">Extraction des candidats</text>
  <text x="400" y="386" text-anchor="middle" class="small">personnes, groupes, salles,</text>
  <text x="400" y="404" text-anchor="middle" class="small">formations, matieres</text>

  <rect x="610" y="330" width="270" height="80" class="process"/>
  <text x="745" y="360" text-anchor="middle" class="box-title">Generation de variantes</text>
  <text x="745" y="386" text-anchor="middle" class="small">formes compactes, initiales,</text>
  <text x="745" y="404" text-anchor="middle" class="small">consonnes, variantes phonetiques</text>

  <rect x="960" y="330" width="270" height="80" class="db"/>
  <text x="1095" y="360" text-anchor="middle" class="box-title">Catalogue metier</text>
  <text x="1095" y="386" text-anchor="middle" class="small">etudiants, enseignants, groupes,</text>
  <text x="1095" y="404" text-anchor="middle" class="small">formations, matieres, salles</text>

  <!-- Row 3 -->
  <rect x="270" y="535" width="260" height="85" class="db"/>
  <text x="400" y="565" text-anchor="middle" class="box-title">Comparaison avec la base</text>
  <text x="400" y="592" text-anchor="middle" class="small">PostgreSQL</text>
  <text x="400" y="611" text-anchor="middle" class="small">donnees institutionnelles</text>

  <rect x="610" y="535" width="270" height="85" class="score"/>
  <text x="745" y="565" text-anchor="middle" class="box-title">Score de similarite</text>
  <text x="745" y="592" text-anchor="middle" class="small">SequenceMatcher, alias,</text>
  <text x="745" y="611" text-anchor="middle" class="small">scores phonetiques</text>

  <rect x="960" y="535" width="270" height="85" class="process"/>
  <text x="1095" y="565" text-anchor="middle" class="box-title">Selection du meilleur lien</text>
  <text x="1095" y="592" text-anchor="middle" class="small">seuils de confiance</text>
  <text x="1095" y="611" text-anchor="middle" class="small">et detection d'ambiguite</text>

  <!-- Row 4 -->
  <rect x="325" y="745" width="300" height="60" class="valid"/>
  <text x="475" y="770" text-anchor="middle" class="box-title">Entite validee</text>
  <text x="475" y="793" text-anchor="middle" class="small">ex: Wiem Arfaoui, GSI 2B</text>

  <rect x="700" y="745" width="300" height="60" class="warn"/>
  <text x="850" y="770" text-anchor="middle" class="box-title">Entite ambigue</text>
  <text x="850" y="793" text-anchor="middle" class="small">proposer les meilleurs candidats</text>

  <rect x="1075" y="745" width="300" height="60" class="python"/>
  <text x="1225" y="770" text-anchor="middle" class="box-title">Question enrichie</text>
  <text x="1225" y="793" text-anchor="middle" class="small">texte + entites resolues</text>

  <!-- Arrows -->
  <path d="M530 177 L610 177" class="arrow"/>
  <path d="M880 177 L960 177" class="arrow"/>
  <path d="M1095 210 L1095 270 L400 270 L400 330" class="arrow"/>
  <path d="M530 370 L610 370" class="arrow"/>
  <path d="M880 370 L960 370" class="arrow"/>
  <path d="M1095 410 L1095 475 L400 475 L400 535" class="arrow"/>
  <path d="M530 577 L610 577" class="arrow"/>
  <path d="M880 577 L960 577" class="arrow"/>
  <path d="M1095 620 L1095 690 L475 690 L475 745" class="arrow"/>
  <path d="M1095 620 L1095 690 L850 690 L850 745" class="dash"/>
  <path d="M625 775 L700 775" class="dash"/>
  <path d="M1000 775 L1075 775" class="arrow"/>

  <text x="850" y="870" text-anchor="middle" class="note">Objectif: corriger les erreurs du STT en reliant les mots transcrits aux entites reelles de PostgreSQL.</text>
</svg>
