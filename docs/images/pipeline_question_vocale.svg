<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 15px Arial, sans-serif; fill: #374151; }
      .section { font: 700 20px Arial, sans-serif; fill: #0f3b8f; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .text { font: 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .note { font: italic 14px Arial, sans-serif; fill: #0f3b8f; }
      .layer { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 18; }
      .input { fill: #f8fbff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .audio { fill: #fbfbff; stroke: #7c3aed; stroke-width: 2; rx: 14; }
      .backend { fill: #eefaf1; stroke: #047857; stroke-width: 2; rx: 14; }
      .stt { fill: #fff8e8; stroke: #92400e; stroke-width: 2; rx: 14; }
      .data { fill: #f7fbff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .llm { fill: #fff1f2; stroke: #be123c; stroke-width: 2; rx: 14; }
      .output { fill: #f0fdf4; stroke: #047857; stroke-width: 2; rx: 14; }
      .arrow { stroke: #1f2937; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #1f2937; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1700" height="980" fill="#ffffff"/>
  <text x="850" y="45" text-anchor="middle" class="title">Pipeline d'une Question Vocale</text>
  <text x="850" y="75" text-anchor="middle" class="subtitle">Transcription Whisper puis reutilisation du pipeline textuel de recherche d'information</text>

  <text x="55" y="155" class="section">1. Capture</text>
  <text x="55" y="180" class="section">vocale</text>
  <rect x="220" y="115" width="1260" height="135" class="layer"/>

  <text x="55" y="340" class="section">2. STT</text>
  <text x="55" y="365" class="section">Whisper</text>
  <rect x="220" y="295" width="1260" height="150" class="layer"/>

  <text x="55" y="545" class="section">3. Passage</text>
  <text x="55" y="570" class="section">au texte</text>
  <rect x="220" y="500" width="1260" height="145" class="layer"/>

  <text x="55" y="745" class="section">4. Recherche</text>
  <text x="55" y="770" class="section">et reponse</text>
  <rect x="220" y="700" width="1260" height="180" class="layer"/>

  <!-- Capture -->
  <rect x="270" y="145" width="210" height="75" class="input"/>
  <text x="375" y="174" text-anchor="middle" class="box-title">Utilisateur</text>
  <text x="375" y="199" text-anchor="middle" class="small">question orale</text>

  <rect x="550" y="145" width="230" height="75" class="audio"/>
  <text x="665" y="174" text-anchor="middle" class="box-title">Microphone</text>
  <text x="665" y="199" text-anchor="middle" class="small">enregistrement audio</text>

  <rect x="850" y="145" width="250" height="75" class="audio"/>
  <text x="975" y="174" text-anchor="middle" class="box-title">Fichier audio</text>
  <text x="975" y="199" text-anchor="middle" class="small">WAV, MP3, M4A...</text>

  <rect x="1170" y="145" width="250" height="75" class="backend"/>
  <text x="1295" y="174" text-anchor="middle" class="box-title">Backend FastAPI</text>
  <text x="1295" y="199" text-anchor="middle" class="small">reception de l'audio</text>

  <!-- Whisper -->
  <rect x="285" y="330" width="260" height="80" class="backend"/>
  <text x="415" y="360" text-anchor="middle" class="box-title">Module STT local</text>
  <text x="415" y="385" text-anchor="middle" class="small">speech_to_text.py</text>

  <rect x="620" y="330" width="250" height="80" class="stt"/>
  <text x="745" y="360" text-anchor="middle" class="box-title">Whisper STT</text>
  <text x="745" y="385" text-anchor="middle" class="small">faster-whisper, modele base</text>

  <rect x="945" y="330" width="250" height="80" class="stt"/>
  <text x="1070" y="360" text-anchor="middle" class="box-title">Transcription locale</text>
  <text x="1070" y="385" text-anchor="middle" class="small">langue fr + VAD optionnel</text>

  <rect x="1270" y="330" width="170" height="80" class="stt"/>
  <text x="1355" y="360" text-anchor="middle" class="box-title">Nettoyage</text>
  <text x="1355" y="385" text-anchor="middle" class="small">texte final</text>

  <!-- Text -->
  <rect x="285" y="535" width="260" height="75" class="output"/>
  <text x="415" y="564" text-anchor="middle" class="box-title">Texte transcrit</text>
  <text x="415" y="589" text-anchor="middle" class="small">question en francais</text>

  <rect x="620" y="535" width="305" height="75" class="backend"/>
  <text x="772" y="564" text-anchor="middle" class="box-title">Correction post-transcription</text>
  <text x="772" y="589" text-anchor="middle" class="small">speech_entity_linker.py + PostgreSQL</text>

  <rect x="1000" y="535" width="250" height="75" class="backend"/>
  <text x="1125" y="564" text-anchor="middle" class="box-title">Question corrigee</text>
  <text x="1125" y="589" text-anchor="middle" class="small">entites reliees a la base</text>

  <!-- Search and answer -->
  <rect x="260" y="735" width="225" height="90" class="backend"/>
  <text x="372" y="765" text-anchor="middle" class="box-title">Traitement NLP</text>
  <text x="372" y="790" text-anchor="middle" class="small">intention + entites</text>
  <text x="372" y="810" text-anchor="middle" class="small">intent_router.py</text>

  <rect x="545" y="735" width="235" height="90" class="data"/>
  <text x="662" y="765" text-anchor="middle" class="box-title">PostgreSQL</text>
  <text x="662" y="790" text-anchor="middle" class="small">SQL ou RAG pgvector</text>
  <text x="662" y="810" text-anchor="middle" class="small">donnees academiques</text>

  <rect x="840" y="735" width="230" height="90" class="backend"/>
  <text x="955" y="765" text-anchor="middle" class="box-title">Contexte</text>
  <text x="955" y="790" text-anchor="middle" class="small">resultats structures</text>
  <text x="955" y="810" text-anchor="middle" class="small">ou passages RAG</text>

  <rect x="1130" y="735" width="190" height="90" class="llm"/>
  <text x="1225" y="765" text-anchor="middle" class="box-title">LLM Ollama</text>
  <text x="1225" y="790" text-anchor="middle" class="small">reformulation</text>

  <rect x="1370" y="735" width="170" height="90" class="output"/>
  <text x="1455" y="765" text-anchor="middle" class="box-title">Reponse</text>
  <text x="1455" y="790" text-anchor="middle" class="small">texte final</text>

  <!-- Arrows -->
  <path d="M480 183 L550 183" class="arrow"/>
  <path d="M780 183 L850 183" class="arrow"/>
  <path d="M1100 183 L1170 183" class="arrow"/>

  <path d="M1295 220 L1295 265 L415 265 L415 330" class="arrow"/>
  <path d="M545 370 L620 370" class="arrow"/>
  <path d="M870 370 L945 370" class="arrow"/>
  <path d="M1195 370 L1270 370" class="arrow"/>

  <path d="M1355 410 L1355 475 L415 475 L415 535" class="arrow"/>
  <path d="M545 572 L620 572" class="arrow"/>
  <path d="M925 572 L1000 572" class="arrow"/>

  <path d="M1125 610 L1125 670 L372 670 L372 735" class="arrow"/>
  <path d="M485 780 L545 780" class="arrow"/>
  <path d="M780 780 L840 780" class="arrow"/>
  <path d="M1070 780 L1130 780" class="arrow"/>
  <path d="M1320 780 L1370 780" class="arrow"/>

  <path d="M1455 825 L1455 920 L375 920 L375 825" class="dash"/>
  <text x="915" y="943" text-anchor="middle" class="note">Apres transcription, le traitement rejoint le meme pipeline que les questions textuelles.</text>
</svg>
