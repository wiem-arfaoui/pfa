<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .layer-title { font: 700 20px Arial, sans-serif; fill: #0f3b8f; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .text { font: 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .note { font: italic 14px Arial, sans-serif; fill: #0f3b8f; }
      .layer { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.6; stroke-dasharray: 6 4; rx: 16; }
      .box { fill: #f8fbff; stroke: #1d4ed8; stroke-width: 1.8; rx: 12; }
      .api { fill: #eefaf1; stroke: #047857; stroke-width: 1.8; rx: 12; }
      .pipe { fill: #fff8e8; stroke: #92400e; stroke-width: 1.6; rx: 12; }
      .data { fill: #f7fbff; stroke: #1d4ed8; stroke-width: 1.8; rx: 12; }
      .rag { fill: #fbf8ff; stroke: #7c3aed; stroke-width: 1.8; rx: 12; }
      .voice { fill: #fbfbff; stroke: #7c3aed; stroke-width: 1.8; rx: 12; }
      .output { fill: #f8fbff; stroke: #1d4ed8; stroke-width: 2; rx: 16; }
      .arrow { stroke: #1f2937; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .thin-arrow { stroke: #1f2937; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dashed-arrow { stroke: #1f2937; stroke-width: 1.7; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="42" text-anchor="middle" class="title">Architecture Globale de la Solution</text>

  <!-- User -->
  <circle cx="800" cy="82" r="14" fill="white" stroke="#111827" stroke-width="2"/>
  <line x1="800" y1="96" x2="800" y2="128" stroke="#111827" stroke-width="2"/>
  <line x1="775" y1="108" x2="825" y2="108" stroke="#111827" stroke-width="2"/>
  <line x1="800" y1="128" x2="780" y2="160" stroke="#111827" stroke-width="2"/>
  <line x1="800" y1="128" x2="820" y2="160" stroke="#111827" stroke-width="2"/>
  <text x="850" y="92" class="box-title">Utilisateur</text>
  <text x="850" y="115" class="text">Etudiant / Enseignant</text>

  <!-- Layers -->
  <text x="55" y="220" class="layer-title">1. Interfaces</text>
  <text x="55" y="245" class="layer-title">utilisateur</text>
  <rect x="230" y="175" width="1010" height="230" class="layer"/>

  <text x="55" y="455" class="layer-title">2. Backend API</text>
  <rect x="230" y="430" width="1010" height="105" class="layer"/>

  <text x="55" y="600" class="layer-title">3. Pipeline</text>
  <text x="55" y="625" class="layer-title">Text-to-Text</text>
  <rect x="230" y="560" width="1010" height="130" class="layer"/>

  <text x="55" y="750" class="layer-title">4. Sources de</text>
  <text x="55" y="775" class="layer-title">connaissances</text>
  <rect x="230" y="715" width="1010" height="165" class="layer"/>

  <text x="55" y="920" class="layer-title">5. Voix et Avatar</text>
  <rect x="230" y="895" width="1010" height="70" class="layer"/>

  <!-- Interface boxes -->
  <rect x="260" y="205" width="440" height="170" class="box"/>
  <text x="480" y="235" text-anchor="middle" class="box-title">Frontend React</text>
  <text x="480" y="258" text-anchor="middle" class="text">Interface web</text>

  <rect x="790" y="205" width="420" height="170" class="box"/>
  <text x="1000" y="235" text-anchor="middle" class="box-title">Application mobile Flutter</text>
  <text x="1000" y="258" text-anchor="middle" class="text">Interface mobile</text>

  <!-- Frontend options -->
  <rect x="285" y="290" width="120" height="48" class="box"/>
  <text x="345" y="319" text-anchor="middle" class="small">Question texte</text>
  <rect x="420" y="290" width="125" height="48" class="box"/>
  <text x="482" y="319" text-anchor="middle" class="small">Question vocale</text>
  <rect x="560" y="290" width="120" height="48" class="box"/>
  <text x="620" y="319" text-anchor="middle" class="small">Selection rapide</text>

  <!-- Mobile options -->
  <rect x="815" y="290" width="120" height="48" class="box"/>
  <text x="875" y="319" text-anchor="middle" class="small">Question texte</text>
  <rect x="950" y="290" width="125" height="48" class="box"/>
  <text x="1012" y="319" text-anchor="middle" class="small">Question vocale</text>
  <rect x="1090" y="290" width="120" height="48" class="box"/>
  <text x="1150" y="319" text-anchor="middle" class="small">Selection rapide</text>

  <!-- Backend -->
  <rect x="520" y="455" width="360" height="58" class="api"/>
  <text x="700" y="480" text-anchor="middle" class="box-title">Backend FastAPI</text>
  <text x="700" y="502" text-anchor="middle" class="text">API centrale</text>

  <!-- Pipeline -->
  <rect x="260" y="590" width="190" height="70" class="pipe"/>
  <text x="355" y="617" text-anchor="middle" class="box-title">Routage d'intention</text>
  <text x="355" y="641" text-anchor="middle" class="small">intent_router.py</text>
  <rect x="500" y="590" width="195" height="70" class="pipe"/>
  <text x="598" y="617" text-anchor="middle" class="box-title">Resolution d'entites</text>
  <text x="598" y="641" text-anchor="middle" class="small">entity_resolver.py</text>
  <rect x="745" y="590" width="235" height="70" class="pipe"/>
  <text x="862" y="612" text-anchor="middle" class="box-title">Construction du contexte</text>
  <text x="862" y="638" text-anchor="middle" class="small">SQL ou RAG selon la question</text>
  <rect x="1030" y="590" width="170" height="70" class="pipe"/>
  <text x="1115" y="617" text-anchor="middle" class="box-title">Reformulation LLM</text>
  <text x="1115" y="641" text-anchor="middle" class="small">Ollama / llama3</text>

  <!-- Data -->
  <text x="260" y="755" class="note">Choix de la source</text>
  <text x="260" y="777" class="note">selon le type de question</text>
  <rect x="430" y="740" width="250" height="100" class="data"/>
  <text x="555" y="765" text-anchor="middle" class="box-title">Donnees structurees SQL</text>
  <text x="555" y="790" text-anchor="middle" class="text">PostgreSQL</text>
  <text x="555" y="814" text-anchor="middle" class="small">formations, groupes, etudiants,</text>
  <text x="555" y="833" text-anchor="middle" class="small">emplois, plans, calendrier</text>
  <text x="555" y="865" text-anchor="middle" class="note">Donnees exactes et structurees</text>

  <rect x="735" y="740" width="250" height="100" class="rag"/>
  <text x="860" y="765" text-anchor="middle" class="box-title">Donnees textuelles RAG</text>
  <text x="860" y="790" text-anchor="middle" class="text">PostgreSQL + pgvector</text>
  <text x="860" y="814" text-anchor="middle" class="small">documents, chunks, embeddings</text>
  <text x="860" y="865" text-anchor="middle" class="note">Descriptions et documents textuels</text>

  <rect x="1060" y="745" width="155" height="90" class="box"/>
  <text x="1138" y="770" text-anchor="middle" class="box-title">Modele</text>
  <text x="1138" y="792" text-anchor="middle" class="box-title">embeddings</text>
  <text x="1138" y="817" text-anchor="middle" class="small">Ollama / embeddinggemma</text>

  <!-- Voice layer -->
  <rect x="430" y="908" width="220" height="45" class="voice"/>
  <text x="540" y="928" text-anchor="middle" class="box-title">Speech-to-Text</text>
  <text x="540" y="947" text-anchor="middle" class="small">questions vocales</text>
  <rect x="710" y="908" width="220" height="45" class="voice"/>
  <text x="820" y="928" text-anchor="middle" class="box-title">Text-to-Speech</text>
  <text x="820" y="947" text-anchor="middle" class="small">lecture vocale des reponses</text>
  <rect x="990" y="908" width="220" height="45" class="voice"/>
  <text x="1100" y="928" text-anchor="middle" class="box-title">Avatar Unity</text>
  <text x="1100" y="947" text-anchor="middle" class="small">representation visuelle optionnelle</text>

  <!-- Output -->
  <rect x="1310" y="445" width="220" height="360" class="output"/>
  <text x="1420" y="480" text-anchor="middle" class="box-title" fill="#0f3b8f">Reponse finale</text>
  <rect x="1340" y="535" width="160" height="85" class="box"/>
  <text x="1420" y="570" text-anchor="middle" class="box-title">Affichage</text>
  <text x="1420" y="595" text-anchor="middle" class="box-title">textuel</text>
  <rect x="1340" y="660" width="160" height="100" class="box"/>
  <text x="1420" y="700" text-anchor="middle" class="box-title">Reponse</text>
  <text x="1420" y="725" text-anchor="middle" class="box-title">vocale + avatar</text>

  <!-- User to interfaces -->
  <path d="M785 160 L480 205" class="arrow"/>
  <path d="M815 160 L1000 205" class="arrow"/>

  <!-- Input arrows: all interface choices go to backend. Vocal requests are then sent by backend to STT. -->
  <path d="M345 338 L345 430 L620 430 L620 455" class="arrow"/>
  <path d="M620 338 L620 430 L660 430 L660 455" class="arrow"/>
  <path d="M482 338 L482 430 L700 430 L700 455" class="arrow"/>
  <path d="M875 338 L875 430 L740 430 L740 455" class="arrow"/>
  <path d="M1150 338 L1150 430 L820 430 L820 455" class="arrow"/>
  <path d="M1012 338 L1012 430 L780 430 L780 455" class="arrow"/>
  <path d="M560 513 L560 908" class="dashed-arrow"/>
  <text x="582" y="705" class="small">si question vocale</text>
  <path d="M650 930 L700 930 L700 513" class="dashed-arrow"/>
  <text x="708" y="720" class="small">texte transcrit</text>

  <!-- Backend to pipeline -->
  <path d="M700 513 L700 560 L355 560 L355 590" class="arrow"/>
  <path d="M450 625 L500 625" class="arrow"/>
  <path d="M695 625 L745 625" class="arrow"/>
  <path d="M980 625 L1030 625" class="arrow"/>

  <!-- Context to data -->
  <path d="M825 660 L555 740" class="arrow"/>
  <path d="M900 660 L860 740" class="arrow"/>
  <path d="M1060 790 L985 790" class="arrow"/>
  <text x="1018" y="782" text-anchor="middle" class="small">embeddings</text>
  <text x="1018" y="802" text-anchor="middle" class="small">768</text>

  <!-- LLM to output -->
  <path d="M1200 625 L1310 625" class="arrow"/>

  <!-- Output back to interfaces -->
  <path d="M1530 520 L1560 520 L1560 170 L1000 170 L1000 205" class="thin-arrow"/>
  <path d="M1530 560 L1575 560 L1575 155 L480 155 L480 205" class="thin-arrow"/>

  <!-- Output voice to TTS and avatar -->
  <path d="M1420 760 L1420 930 L930 930" class="arrow"/>
  <path d="M710 930 L650 930" class="thin-arrow"/>
  <path d="M930 930 L990 930" class="arrow"/>
</svg>
