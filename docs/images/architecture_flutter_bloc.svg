<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 15px Arial, sans-serif; fill: #374151; }
      .layer-title { font: 700 22px Arial, sans-serif; fill: #0f3b8f; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .text { font: 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .note { font: italic 14px Arial, sans-serif; fill: #0f3b8f; }
      .layer { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 18; }
      .presentation { fill: #f8fbff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .bloc { fill: #fbf8ff; stroke: #7c3aed; stroke-width: 2; rx: 14; }
      .data { fill: #eefaf1; stroke: #047857; stroke-width: 2; rx: 14; }
      .backend { fill: #fff8e8; stroke: #92400e; stroke-width: 2; rx: 14; }
      .db { fill: #f7fbff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
      .arrow { stroke: #1f2937; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .return { stroke: #1f2937; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="800" y="45" text-anchor="middle" class="title">Architecture de l'Application Mobile Flutter</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle">Organisation selon le pattern BLoC pour separer interface, etats et communication backend</text>

  <!-- Mobile app boundary -->
  <rect x="110" y="120" width="980" height="650" class="layer"/>
  <text x="145" y="155" class="layer-title">Application mobile Flutter</text>

  <!-- Backend boundary -->
  <rect x="1160" y="245" width="330" height="335" class="layer"/>
  <text x="1190" y="280" class="layer-title">Backend</text>

  <!-- Presentation layer -->
  <rect x="180" y="205" width="840" height="135" class="presentation"/>
  <text x="600" y="235" text-anchor="middle" class="layer-title">Couche Presentation</text>
  <rect x="235" y="270" width="210" height="45" class="presentation"/>
  <text x="340" y="299" text-anchor="middle" class="box-title">Pages Flutter</text>
  <rect x="495" y="270" width="210" height="45" class="presentation"/>
  <text x="600" y="299" text-anchor="middle" class="box-title">Widgets</text>
  <rect x="755" y="270" width="210" height="45" class="presentation"/>
  <text x="860" y="299" text-anchor="middle" class="box-title">Affichage UI</text>

  <!-- BLoC layer -->
  <rect x="180" y="405" width="840" height="145" class="bloc"/>
  <text x="600" y="435" text-anchor="middle" class="layer-title">Couche BLoC</text>
  <rect x="260" y="475" width="210" height="45" class="bloc"/>
  <text x="365" y="504" text-anchor="middle" class="box-title">ChatBloc</text>
  <rect x="520" y="475" width="210" height="45" class="bloc"/>
  <text x="625" y="504" text-anchor="middle" class="box-title">HistoryBloc</text>
  <rect x="780" y="475" width="185" height="45" class="bloc"/>
  <text x="872" y="504" text-anchor="middle" class="box-title">Etats / Events</text>

  <!-- Data layer -->
  <rect x="180" y="615" width="840" height="115" class="data"/>
  <text x="600" y="645" text-anchor="middle" class="layer-title">Couche Data</text>
  <rect x="260" y="680" width="245" height="38" class="data"/>
  <text x="382" y="705" text-anchor="middle" class="box-title">ChatService</text>
  <rect x="555" y="680" width="245" height="38" class="data"/>
  <text x="677" y="705" text-anchor="middle" class="box-title">HistoryService</text>
  <rect x="850" y="680" width="130" height="38" class="data"/>
  <text x="915" y="705" text-anchor="middle" class="box-title">HTTP</text>

  <!-- Backend boxes -->
  <rect x="1210" y="325" width="230" height="70" class="backend"/>
  <text x="1325" y="354" text-anchor="middle" class="box-title">Backend FastAPI</text>
  <text x="1325" y="377" text-anchor="middle" class="small">API question / historique</text>

  <rect x="1210" y="450" width="230" height="70" class="db"/>
  <text x="1325" y="479" text-anchor="middle" class="box-title">PostgreSQL / RAG</text>
  <text x="1325" y="502" text-anchor="middle" class="small">donnees et contexte</text>

  <!-- Arrows -->
  <path d="M600 340 L600 405" class="arrow"/>
  <text x="620" y="375" class="small">events utilisateur</text>

  <path d="M600 550 L600 615" class="arrow"/>
  <text x="620" y="586" class="small">demandes metier</text>

  <path d="M1020 700 L1160 700 L1160 360 L1210 360" class="arrow"/>
  <text x="1095" y="690" text-anchor="middle" class="small">requete HTTP</text>

  <path d="M1325 395 L1325 450" class="arrow"/>
  <path d="M1210 485 L1130 485 L1130 745 L600 745 L600 730" class="return"/>
  <text x="870" y="765" text-anchor="middle" class="small">reponse JSON</text>

  <path d="M520 615 L520 550" class="return"/>
  <text x="405" y="590" class="small">nouvel etat</text>

  <path d="M520 405 L520 340" class="return"/>
  <text x="405" y="375" class="small">mise a jour UI</text>

  <text x="800" y="820" text-anchor="middle" class="note">Le pattern BLoC isole la logique metier de l'interface et centralise la gestion des etats.</text>
</svg>
