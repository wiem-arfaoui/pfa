<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6" fill="none" stroke="#111827" stroke-width="1.6"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 15px Arial, sans-serif; fill: #374151; }
      .actor-name { font: 700 16px Arial, sans-serif; fill: #111827; }
      .participant { fill: #f8fbff; stroke: #1d4ed8; stroke-width: 2; rx: 10; }
      .backend { fill: #eefaf1; stroke: #047857; stroke-width: 2; rx: 10; }
      .stt { fill: #fff8e8; stroke: #92400e; stroke-width: 2; rx: 10; }
      .linker { fill: #fbf8ff; stroke: #7c3aed; stroke-width: 2; rx: 10; }
      .llm { fill: #fff1f2; stroke: #be123c; stroke-width: 2; rx: 10; }
      .tts { fill: #f0fdf4; stroke: #047857; stroke-width: 2; rx: 10; }
      .lifeline { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .activation { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .message { stroke: #111827; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .return { stroke: #111827; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; marker-end: url(#openArrow); }
      .self { stroke: #111827; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .msg-text { font: 14px Arial, sans-serif; fill: #111827; }
      .small { font: 12.5px Arial, sans-serif; fill: #374151; }
      .frame { fill: #ffffff; stroke: #374151; stroke-width: 1.6; rx: 4; }
      .frame-label { fill: #f3f4f6; stroke: #374151; stroke-width: 1.4; }
      .frame-title { font: 700 13px Arial, sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="#ffffff"/>
  <text x="900" y="45" text-anchor="middle" class="title">Diagramme de Sequence d'une Question Vocale</text>
  <text x="900" y="75" text-anchor="middle" class="subtitle">De l'enregistrement microphone jusqu'a la reponse textuelle ou vocale</text>

  <!-- Participants -->
  <circle cx="90" cy="130" r="14" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <line x1="90" y1="144" x2="90" y2="178" stroke="#111827" stroke-width="2"/>
  <line x1="65" y1="156" x2="115" y2="156" stroke="#111827" stroke-width="2"/>
  <line x1="90" y1="178" x2="69" y2="210" stroke="#111827" stroke-width="2"/>
  <line x1="90" y1="178" x2="111" y2="210" stroke="#111827" stroke-width="2"/>
  <text x="90" y="235" text-anchor="middle" class="actor-name">Utilisateur</text>

  <rect x="165" y="110" width="165" height="72" class="participant"/>
  <text x="247" y="138" text-anchor="middle" class="actor-name">Interface</text>
  <text x="247" y="160" text-anchor="middle" class="small">graphique</text>

  <rect x="405" y="110" width="170" height="72" class="backend"/>
  <text x="490" y="138" text-anchor="middle" class="actor-name">Backend</text>
  <text x="490" y="160" text-anchor="middle" class="small">FastAPI</text>

  <rect x="650" y="110" width="145" height="72" class="stt"/>
  <text x="722" y="138" text-anchor="middle" class="actor-name">Whisper</text>
  <text x="722" y="160" text-anchor="middle" class="small">STT local</text>

  <rect x="870" y="110" width="170" height="72" class="linker"/>
  <text x="955" y="138" text-anchor="middle" class="actor-name">Entity Linking</text>
  <text x="955" y="160" text-anchor="middle" class="small">noms propres</text>

  <rect x="1115" y="110" width="165" height="72" class="participant"/>
  <text x="1197" y="138" text-anchor="middle" class="actor-name">PostgreSQL</text>
  <text x="1197" y="160" text-anchor="middle" class="small">SQL / RAG</text>

  <rect x="1355" y="110" width="145" height="72" class="llm"/>
  <text x="1427" y="138" text-anchor="middle" class="actor-name">Ollama</text>
  <text x="1427" y="160" text-anchor="middle" class="small">LLM</text>

  <rect x="1575" y="110" width="155" height="72" class="tts"/>
  <text x="1652" y="138" text-anchor="middle" class="actor-name">Web Speech</text>
  <text x="1652" y="160" text-anchor="middle" class="small">API / TTS</text>

  <!-- Lifelines -->
  <line x1="90" y1="250" x2="90" y2="1205" class="lifeline"/>
  <line x1="247" y1="182" x2="247" y2="1205" class="lifeline"/>
  <line x1="490" y1="182" x2="490" y2="1205" class="lifeline"/>
  <line x1="722" y1="182" x2="722" y2="1205" class="lifeline"/>
  <line x1="955" y1="182" x2="955" y2="1205" class="lifeline"/>
  <line x1="1197" y1="182" x2="1197" y2="1205" class="lifeline"/>
  <line x1="1427" y1="182" x2="1427" y2="1205" class="lifeline"/>
  <line x1="1652" y1="182" x2="1652" y2="1205" class="lifeline"/>

  <!-- Activations -->
  <rect x="239" y="285" width="16" height="820" class="activation"/>
  <rect x="482" y="410" width="16" height="650" class="activation"/>
  <rect x="714" y="475" width="16" height="100" class="activation"/>
  <rect x="947" y="620" width="16" height="115" class="activation"/>
  <rect x="1189" y="680" width="16" height="130" class="activation"/>
  <rect x="1419" y="870" width="16" height="95" class="activation"/>
  <rect x="1644" y="1080" width="16" height="80" class="activation"/>

  <!-- Messages -->
  <line x1="107" y1="300" x2="239" y2="300" class="message"/>
  <text x="173" y="292" text-anchor="middle" class="msg-text">1. cliquer microphone</text>

  <path d="M255 330 L320 330 L320 370 L255 370" class="self"/>
  <text x="335" y="343" class="msg-text">2. enregistrer audio</text>
  <text x="335" y="363" class="small">question vocale</text>

  <line x1="255" y1="430" x2="482" y2="430" class="message"/>
  <text x="368" y="422" text-anchor="middle" class="msg-text">3. envoyer fichier audio</text>

  <line x1="498" y1="500" x2="714" y2="500" class="message"/>
  <text x="606" y="492" text-anchor="middle" class="msg-text">4. transcrire audio</text>

  <line x1="714" y1="560" x2="498" y2="560" class="return"/>
  <text x="606" y="552" text-anchor="middle" class="msg-text">5. texte transcrit</text>

  <line x1="498" y1="640" x2="947" y2="640" class="message"/>
  <text x="722" y="632" text-anchor="middle" class="msg-text">6. corriger noms propres</text>

  <line x1="963" y1="695" x2="1189" y2="695" class="message"/>
  <text x="1076" y="687" text-anchor="middle" class="msg-text">7. comparer avec la base</text>

  <line x1="1189" y1="750" x2="963" y2="750" class="return"/>
  <text x="1076" y="742" text-anchor="middle" class="msg-text">8. entites candidates / validees</text>

  <line x1="947" y1="795" x2="498" y2="795" class="return"/>
  <text x="722" y="787" text-anchor="middle" class="msg-text">9. texte corrige + entites</text>

  <path d="M498 825 L560 825 L560 865 L498 865" class="self"/>
  <text x="578" y="838" class="msg-text">10. identifier intention</text>
  <text x="578" y="858" class="small">et entites finales</text>

  <line x1="498" y1="890" x2="1189" y2="890" class="message"/>
  <text x="843" y="882" text-anchor="middle" class="msg-text">11. interroger PostgreSQL / RAG</text>

  <line x1="1189" y1="940" x2="498" y2="940" class="return"/>
  <text x="843" y="932" text-anchor="middle" class="msg-text">12. contexte recupere</text>

  <line x1="498" y1="980" x2="1419" y2="980" class="message"/>
  <text x="958" y="972" text-anchor="middle" class="msg-text">13. transmettre contexte au modele</text>

  <line x1="1419" y1="1045" x2="498" y2="1045" class="return"/>
  <text x="958" y="1037" text-anchor="middle" class="msg-text">14. reponse naturelle</text>

  <line x1="482" y1="1085" x2="255" y2="1085" class="return"/>
  <text x="368" y="1077" text-anchor="middle" class="msg-text">15. retourner reponse</text>

  <!-- Optional TTS frame -->
  <rect x="205" y="1115" width="1510" height="85" class="frame"/>
  <polygon points="205,1115 315,1115 335,1140 205,1140" class="frame-label"/>
  <text x="250" y="1133" text-anchor="middle" class="frame-title">opt</text>
  <text x="350" y="1135" class="small">si TTS active</text>

  <line x1="255" y1="1160" x2="1644" y2="1160" class="message"/>
  <text x="950" y="1152" text-anchor="middle" class="msg-text">16. lire vocalement la reponse</text>

  <line x1="1644" y1="1190" x2="255" y2="1190" class="return"/>
  <text x="950" y="1182" text-anchor="middle" class="msg-text">17. retourner la reponse vocale</text>

  <line x1="239" y1="1225" x2="107" y2="1225" class="return"/>
  <text x="173" y="1217" text-anchor="middle" class="msg-text">18. consulter / ecouter</text>

  <text x="900" y="1260" text-anchor="middle" class="small">Notation UML: fleches pleines = appels, fleches pointillees = retours, cadre opt = restitution vocale optionnelle.</text>
</svg>
